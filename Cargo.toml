[package]
name = "tty-rex"
version = "1.0.1"
edition = "2021"
license = "BSD-3-Clause"
description = "Asciiverse total conversion of Chrome's offline T-Rex runner, Rust + Ratatui + Braille"

[[bin]]
name = "tty-rex"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
gilrs = { version = "0.11", optional = true, default-features = false, features = ["xinput"] }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
