[package]
name = "tty-rex"
version = "0.1.0"
edition = "2021"
description = "Asciiverse total conversion of Chrome's offline T-Rex runner, Rust + Ratatui + Braille"

[[bin]]
name = "tty-rex"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
drawprobe = { path = "../../crates/drawprobe" }

[profile.release]
debug = 1
